name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Remote Server URL (e.g. https://celsius.network, leave empty to use local assets)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select active Xcode toolchain
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || '' }}
        run: npm run build

      - name: Copy Web Assets to Capacitor iOS
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || '' }}
        run: npx cap copy ios

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      - name: Build iOS App binary without code signing
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package App into unsigned IPA for Sideloadly
        run: |
          mkdir -p build_output/Payload
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found in build directory"
            find ios/App/build -name "*.app"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build_output/Payload/
          cd build_output
          zip -r -q CelsiusTerminal-unsigned.ipa Payload
          echo "Unsigned IPA packaged successfully:"
          ls -lh CelsiusTerminal-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CelsiusTerminal-iOS-IPA
          path: build_output/CelsiusTerminal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/CelsiusTerminal-unsigned.ipa
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'Release v1.0.0 (Celsius Terminal iOS IPA)' }}
          draft: false
          prerelease: false
          generate_release_notes: true
