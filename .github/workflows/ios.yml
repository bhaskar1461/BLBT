name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Remote Server URL (e.g. https://celsius.network, leave empty to use local assets)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || '' }}
        run: npm run build

      - name: Synchronize Capacitor iOS
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || '' }}
        run: npx cap sync ios

      - name: Select active Xcode toolchain
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      - name: Build iOS App binary without code signing
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package App into unsigned IPA for Sideloadly
        run: |
          mkdir -p build_output/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app build_output/Payload/
          cd build_output
          zip -r -q CelsiusTerminal-unsigned.ipa Payload
          echo "Unsigned IPA packaged successfully:"
          ls -lh CelsiusTerminal-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CelsiusTerminal-iOS-IPA
          path: build_output/CelsiusTerminal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release with IPA
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/CelsiusTerminal-unsigned.ipa
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
